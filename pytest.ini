[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
markers =
    unit: Unit tests for individual components
    integration: Integration tests for subsystems
    e2e: End-to-end tests
    async: Asynchronous operation tests
    async_: Asynchronous operation tests (legacy marker)
    asyncio: Asyncio coroutine tests
    embedding: Vector embedding tests
    ingestion: RAG data ingestion tests
    generation: LLM generation tests
    verification: System verification tests
    smoke: Smoke tests for quick validation
    slow: Slow running tests
